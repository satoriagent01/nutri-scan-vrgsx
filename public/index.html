<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriScan - Free Nutrition Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🥗 NutriScan</h1>
    <p class="subtitle">Free, ad-free nutrition tracking</p>
  </header>

  <main>
    <!-- OCR Section -->
    <section id="ocr-section">
      <h2>📸 Scan Nutrition Label</h2>
      <div class="upload-area" id="upload-area">
        <p>Drag & drop a photo here, or click to upload</p>
        <input type="file" id="file-input" accept="image/*" capture="environment">
      </div>
      <div id="scan-preview" class="hidden">
        <img id="preview-img" src="" alt="Scanned product">
      </div>
      <div id="scan-results" class="hidden">
        <h3>Extracted Nutrition (per 100g)</h3>
        <div id="nutrition-grid" class="nutrition-grid"></div>
        <button id="add-to-meal" class="btn btn-primary">Add to Meal Plan</button>
      </div>
      <div id="ai-config" class="config-panel">
        <h3>AI Configuration</h3>
        <label for="ai-url">AI Endpoint URL:</label>
        <input type="text" id="ai-url" placeholder="https://api.openai.com/v1/chat/completions">
        <label for="ai-key">API Key:</label>
        <input type="password" id="ai-key" placeholder="sk-...">
        <button id="save-ai-config" class="btn btn-secondary">Save Config</button>
      </div>
    </section>

    <!-- Meal Planner Section -->
    <section id="meal-section">
      <h2>🍽️ Meal Planner</h2>
      <div id="meal-products">
        <!-- Products will be added here dynamically -->
      </div>
      <button id="add-product" class="btn btn-secondary">+ Add Product</button>
      <div id="meal-total" class="meal-total hidden">
        <h3>Meal Total</h3>
        <div id="meal-total-grid" class="nutrition-grid"></div>
      </div>
      <button id="save-meal" class="btn btn-primary">Save Meal Plan</button>
    </section>

    <!-- Tracker Section -->
    <section id="tracker-section">
      <h2>📊 Daily Tracker</h2>
      <div id="progress-grid" class="nutrition-grid"></div>
      <div class="goal-settings">
        <h3>Custom Goals</h3>
        <div id="goal-inputs" class="goal-inputs"></div>
        <button id="save-goals" class="btn btn-secondary">Save Goals</button>
      </div>
      <button id="reset-tracker" class="btn btn-danger">Reset Daily</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
